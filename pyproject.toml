[project]
name = "rss-to-discord"
version = "0.1.0"
description = "Script para divulgar um feed RSS em um canal do Discord"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13",
    "discord-py>=2.3.2",
    "fastapi>=0.115",
    "feedparser>=6.0.12",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]
